<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Learn | Courses</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #6366f1;
        --secondary: #ec4899;
        --bg-dark: #0f172a;
        --sidebar-bg: rgba(15, 23, 42, 0.7);
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-dark);
        color: #fff;
        min-height: 100vh;
        overflow-x: hidden;
        margin: 0;
        display: flex;
      }
      
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(100px);
        z-index: -1;
      }
      .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -50px; right: -100px; opacity: 0.3; animation: drift 15s infinite alternate ease-in-out; }
      .orb-2 { width: 500px; height: 500px; background: var(--secondary); bottom: -150px; left: -150px; opacity: 0.2; animation: drift 20s infinite alternate-reverse ease-in-out; }
      @keyframes drift {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-40px, 40px); }
      }

      /* Sidebar */
      #sidebar {
        width: 280px;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--glass-border);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        height: 100vh;
        position: fixed;
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        z-index: 1000;
        transition: transform 0.3s ease;
      }
      .brand {
        font-size: 1.8rem;
        font-weight: 800;
        margin-bottom: 40px;
        text-align: center;
        background: linear-gradient(to right, #a855f7, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .nav-link {
        color: #94a3b8;
        padding: 12px 20px;
        border-radius: 12px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 15px;
        font-weight: 600;
        transition: all 0.3s;
        text-decoration: none;
      }
      .nav-link:hover, .nav-link.active {
        background: rgba(99, 102, 241, 0.15);
        color: #fff;
      }
      .nav-link i { font-size: 1.2rem; width: 24px; text-align: center; }
      .logout { margin-top: auto; color: #ef4444; }
      .logout:hover { background: rgba(239, 68, 68, 0.15); color: #f87171; }

      /* Main Content */
      #main-content {
        margin-left: 280px;
        padding: 40px;
        width: calc(100% - 280px);
      }
      
      .dashboard-header {
        margin-bottom: 40px;
      }
      .dashboard-header h2 {
        font-weight: 800;
        font-size: 2.5rem;
        background: linear-gradient(to right, #fff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      .top-nav {
        display: flex;
        gap: 15px;
        margin-bottom: 30px;
      }
      .top-nav button {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        color: #94a3b8;
        padding: 10px 20px;
        border-radius: 12px;
        font-weight: 600;
        transition: all 0.3s;
      }
      .top-nav button.active, .top-nav button:hover {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .section { display: none; }
      .active-section { display: block; animation: fadeIn 0.5s ease-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
      }

      .course-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(16px);
        border-radius: 20px;
        padding: 15px;
        transition: transform 0.3s, box-shadow 0.3s;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .course-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
      }
      .course-card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 15px;
        background: rgba(255,255,255,0.05);
      }
      .course-card h5 {
        font-weight: 600;
        font-size: 1.1rem;
        margin-bottom: 20px;
        color: #f8fafc;
      }
      .card-actions {
        display: flex;
        gap: 10px;
        margin-top: auto;
      }
      .btn-enroll, .btn-playlist {
        flex: 1;
        padding: 8px;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        border: none;
        transition: transform 0.2s;
      }
      .btn-enroll { background: linear-gradient(45deg, #10b981, #059669); color: white; }
      .btn-playlist { background: linear-gradient(45deg, var(--primary), #4f46e5); color: white; }
      .btn-enroll:hover, .btn-playlist:hover { transform: translateY(-2px); }

      .table { color: #f8fafc; background: var(--glass-bg); backdrop-filter: blur(16px); border-radius: 20px; overflow: hidden; }
      .table th { border-bottom: 1px solid var(--glass-border); color: #cbd5e1; font-weight: 600; padding: 15px 20px; }
      .table td { border-bottom: 1px solid var(--glass-border); padding: 15px 20px; vertical-align: middle; }
      .table tr:last-child td { border-bottom: none; }
      
      .btn-watch {
        background: linear-gradient(45deg, #ec4899, #be185d);
        color: white;
        border: none;
        padding: 6px 15px;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Sidebar -->
    <nav id="sidebar">
      <div class="brand">E-Learn</div>
      <a href="/dashboard" class="nav-link"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="/courses" class="nav-link active"><i class="fas fa-book-open"></i> Courses</a>
      <a href="/learning" class="nav-link"><i class="fas fa-brain"></i> Learning</a>
      <a href="/workspace" class="nav-link"><i class="fas fa-tools"></i> Workspace</a>
      <a href="/logout" class="nav-link logout"><i class="fas fa-sign-out-alt"></i> Log Out</a>
    </nav>

    <!-- Main Content -->
    <main id="main-content">
      <div class="dashboard-header">
        <h2>Explore Courses</h2>
        <p class="text-secondary">Discover new skills or continue where you left off.</p>
      </div>

      <div class="top-nav">
        <button class="active" onclick="showSection('available-courses', this)">Available Courses</button>
        <button onclick="showSection('enrolled-courses-section', this)">Enrolled Courses</button>
        <button onclick="showSection('playlist-courses-section', this)">My Playlist</button>
      </div>

      <!-- Available Courses -->
      <div id="available-courses" class="section active-section">
        <div class="grid-container" id="courses-container"></div>
      </div>

      <!-- Enrolled Courses -->
      <div id="enrolled-courses-section" class="section">
        <table class="table">
          <thead>
            <tr>
              <th>Course Name</th>
              <th width="150">Action</th>
            </tr>
          </thead>
          <tbody id="enrolled-courses">
            <tr><td colspan="2" class="text-center text-secondary py-4">No enrolled courses yet.</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Playlist -->
      <div id="playlist-courses-section" class="section">
        <table class="table">
          <thead>
            <tr>
              <th>Course Name</th>
            </tr>
          </thead>
          <tbody id="playlist-courses">
            <tr><td class="text-center text-secondary py-4">Your playlist is empty.</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <script>
      const fallbackImg = (text) => `https://placehold.co/400x200/1e293b/ffffff?text=${encodeURIComponent(text)}`;

      const courses = [
        { name: "Web Development", image: "/assets/1.jpg" },
        { name: "Machine Learning", image: "/assets/2.jpg" },
        { name: "Data Science", image: "/assets/8.jpg" },
        { name: "UI/UX Design", image: "/assets/9.jpg" },
        { name: "Cyber Security", image: "/assets/3.jpg" },
        { name: "Blockchain", image: "/assets/4.jpg" },
        { name: "Cloud Computing", image: "/assets/6.jpg" },
        { name: "Mobile App Development", image: "/assets/5.jpg" },
        { name: "Artificial Intelligence", image: "/assets/0.png" },
        { name: "Game Development", image: "/assets/7.jpg" },
      ];

      const enrolledCourses = [];
      const playlistCourses = [];

      function renderCourses() {
        const container = document.getElementById("courses-container");
        container.innerHTML = courses.map((course, index) => `
          <div class="course-card">
            <img src="${course.image}" onerror="this.onerror=null;this.src='${fallbackImg(course.name)}';" alt="${course.name}">
            <h5>${course.name}</h5>
            <div class="card-actions">
              <button class="btn-enroll" onclick="enrollCourse(${index})">Enroll</button>
              <button class="btn-playlist" onclick="addToPlaylist(${index})"><i class="fas fa-plus"></i> Playlist</button>
            </div>
          </div>
        `).join("");
      }

      function enrollCourse(index) {
        const course = courses[index];
        if (!enrolledCourses.includes(course.name)) {
          enrolledCourses.push(course.name);
          renderEnrolledCourses();
        } else {
          alert("Already enrolled in this course!");
        }
      }

      function addToPlaylist(index) {
        const course = courses[index];
        if (!playlistCourses.includes(course.name)) {
          playlistCourses.push(course.name);
          renderPlaylistCourses();
        } else {
          alert("Course already in the playlist!");
        }
      }

      function renderEnrolledCourses() {
        const table = document.getElementById("enrolled-courses");
        if(enrolledCourses.length === 0) {
          table.innerHTML = `<tr><td colspan="2" class="text-center text-secondary py-4">No enrolled courses yet.</td></tr>`;
          return;
        }
        table.innerHTML = enrolledCourses.map(course => `
          <tr>
            <td>${course}</td>
            <td><button class="btn-watch" onclick="window.open('about:blank', '_blank')"><i class="fas fa-play"></i> Watch</button></td>
          </tr>
        `).join("");
      }

      function renderPlaylistCourses() {
        const table = document.getElementById("playlist-courses");
        if(playlistCourses.length === 0) {
          table.innerHTML = `<tr><td class="text-center text-secondary py-4">Your playlist is empty.</td></tr>`;
          return;
        }
        table.innerHTML = playlistCourses.map(course => `<tr><td>${course}</td></tr>`).join("");
      }

      function showSection(sectionId, btn) {
        document.querySelectorAll(".section").forEach(sec => sec.classList.remove("active-section"));
        document.getElementById(sectionId).classList.add("active-section");
        
        document.querySelectorAll(".top-nav button").forEach(b => b.classList.remove("active"));
        if(btn) btn.classList.add("active");
      }

      renderCourses();
    </script>
  </body>
</html>
