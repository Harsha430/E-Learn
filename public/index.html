<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Learn | The Future of Learning</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #6366f1;
        --secondary: #ec4899;
        --bg-dark: #0f172a;
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-dark);
        color: #fff;
        min-height: 100vh;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }
      /* Modern Background Orbs */
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        z-index: -1;
        animation: float 10s infinite alternate ease-in-out;
      }
      .orb-1 {
        width: 400px;
        height: 400px;
        background: var(--primary);
        top: -100px;
        left: -100px;
        opacity: 0.4;
      }
      .orb-2 {
        width: 300px;
        height: 300px;
        background: var(--secondary);
        bottom: -50px;
        right: -50px;
        opacity: 0.3;
        animation-delay: -5s;
      }
      @keyframes float {
        0% { transform: translateY(0) scale(1); }
        100% { transform: translateY(50px) scale(1.1); }
      }
      
      .glass-container {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 24px;
        padding: 60px 40px;
        text-align: center;
        max-width: 600px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: slideUp 0.8s ease-out forwards;
        opacity: 0;
        transform: translateY(30px);
      }
      @keyframes slideUp {
        to { opacity: 1; transform: translateY(0); }
      }

      .logo-svg {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        animation: pulseAndSpin 6s infinite linear;
      }
      @keyframes pulseAndSpin {
        0% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.1); }
        100% { transform: rotate(360deg) scale(1); }
      }

      h1 {
        font-weight: 800;
        font-size: 3rem;
        margin-bottom: 16px;
        background: linear-gradient(to right, #a855f7, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.2;
      }
      p.lead {
        font-weight: 300;
        color: #cbd5e1;
        margin-bottom: 40px;
      }

      .btn-modern {
        font-weight: 600;
        padding: 14px 32px;
        border-radius: 50px;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.9rem;
        position: relative;
        overflow: hidden;
        z-index: 1;
        border: none;
        text-decoration: none;
      }
      .btn-primary-modern {
        background: linear-gradient(45deg, var(--primary), #8b5cf6);
        color: white;
        box-shadow: 0 10px 20px -10px var(--primary);
      }
      .btn-primary-modern:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 25px -10px var(--primary);
        color: white;
      }
      
      .btn-secondary-modern {
        background: rgba(255,255,255,0.1);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.2);
      }
      .btn-secondary-modern:hover {
        background: rgba(255,255,255,0.2);
        color: #fff;
        transform: translateY(-3px);
      }
      
      .action-buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
      }
      @media (max-width: 500px) {
        .action-buttons { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-container">
      <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" stroke="url(#paint0_linear)" stroke-width="6" stroke-dasharray="70 20" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="25" fill="url(#paint1_linear)"/>
        <defs>
          <linearGradient id="paint0_linear" x1="5" y1="5" x2="95" y2="95" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8b5cf6"/>
            <stop offset="1" stop-color="#ec4899"/>
          </linearGradient>
          <linearGradient id="paint1_linear" x1="25" y1="25" x2="75" y2="75" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366f1"/>
            <stop offset="1" stop-color="#a855f7"/>
          </linearGradient>
        </defs>
      </svg>
      <h1>E-Learn Platform</h1>
      <p class="lead">Unlock your potential with our immersive, next-generation learning experience.</p>
      <div class="action-buttons">
        <a href="/login" class="btn-modern btn-primary-modern">Log In</a>
        <a href="/register" class="btn-modern btn-secondary-modern">Create Account</a>
      </div>
    </div>
  </body>
</html>
