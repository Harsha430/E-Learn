<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Learn | Create Account</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css" />
    <style>
      :root {
        --primary: #6366f1;
        --secondary: #ec4899;
        --bg-dark: #0f172a;
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-dark);
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 40px 20px;
        position: relative;
        overflow-x: hidden;
      }
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(100px);
        z-index: -1;
      }
      .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -50px; left: -150px; opacity: 0.3; animation: drift 12s infinite alternate ease-in-out; }
      .orb-2 { width: 500px; height: 500px; background: #3b82f6; bottom: -200px; right: -100px; opacity: 0.2; animation: drift 15s infinite alternate-reverse ease-in-out; }
      
      @keyframes drift {
        0% { transform: translate(0, 0); }
        100% { transform: translate(40px, -40px); }
      }

      .register-glass {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 550px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: fadeScale 0.6s ease-out forwards;
      }
      
      @keyframes fadeScale {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      h2 {
        font-weight: 600;
        text-align: center;
        margin-bottom: 30px;
        font-size: 2rem;
        background: linear-gradient(to right, #fff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .form-control, .form-select {
        background: rgba(0,0,0,0.2) !important;
        border: 1px solid rgba(255,255,255,0.1) !important;
        color: #fff !important;
        border-radius: 12px;
        padding: 12px 15px;
      }
      .form-control:focus, .form-select:focus {
        background: rgba(0,0,0,0.3) !important;
        border-color: var(--primary) !important;
        box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25) !important;
      }
      .form-control::placeholder { color: #64748b; }
      
      .input-group-text {
        background: rgba(0,0,0,0.3);
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--primary);
        border-radius: 12px 0 0 12px;
      }
      .form-control.rounded-end { border-radius: 0 12px 12px 0; }
      
      .form-label {
        font-size: 0.9rem;
        font-weight: 600;
        color: #cbd5e1;
        margin-bottom: 8px;
      }

      select option { background: #1e293b; color: white; }

      .btn-register {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        background: linear-gradient(45deg, var(--primary), #8b5cf6);
        border: none;
        color: white;
        font-weight: 600;
        font-size: 1.1rem;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 8px 15px -5px rgba(99, 102, 241, 0.4);
        margin-top: 20px;
      }
      .btn-register:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 20px -5px rgba(99, 102, 241, 0.6);
        color: white;
      }

      .footer-text {
        text-align: center;
        margin-top: 25px;
        color: #94a3b8;
        font-size: 0.9rem;
      }
      .footer-text a {
        color: #a855f7;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s;
      }
      .footer-text a:hover { color: #d8b4fe; }
    </style>
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="register-glass">
      <h2>Create Account</h2>
      <form action="/register" method="POST" id="registrationForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="name" class="form-label">Full Name</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control rounded-end" id="name" name="name" required placeholder="John Doe">
            </div>
          </div>
          
          <div class="col-md-6">
            <label for="dob" class="form-label">Date of Birth</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-calendar"></i></span>
              <input type="date" class="form-control rounded-end" id="dob" name="dob" required>
            </div>
          </div>
          
          <div class="col-md-6">
            <label for="place" class="form-label">Place</label>
            <input type="text" class="form-control" id="place" name="place" required placeholder="City">
          </div>
          
          <div class="col-md-6">
            <label for="mobile" class="form-label">Mobile Number</label>
            <input type="tel" class="form-control" id="mobile" name="mobile" pattern="[0-9]{10}" required placeholder="10-digit number">
          </div>
          
          <div class="col-md-6">
            <label for="age" class="form-label">Age</label>
            <input type="number" class="form-control" id="age" name="age" required placeholder="e.g. 25">
          </div>
          
          <div class="col-md-6">
            <label for="gender" class="form-label">Gender</label>
            <select class="form-select" id="gender" name="gender" required>
              <option value="" disabled selected>Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          
          <div class="col-12">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
          </div>
          
          <div class="col-md-6">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
          </div>
          
          <div class="col-md-6">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required placeholder="••••••••">
          </div>
        </div>
        
        <div id="passwordError" class="text-danger mt-2 d-none" style="font-size: 0.85rem;"><i class="bi bi-exclamation-circle"></i> Passwords do not match.</div>

        <button type="submit" class="btn-register">Register Now</button>
        
        <div class="footer-text">
          Already have an account? <a href="/login">Log in here</a>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById("registrationForm").addEventListener("submit", function (e) {
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const passwordError = document.getElementById("passwordError");

        if (password !== confirmPassword) {
          e.preventDefault();
          passwordError.classList.remove("d-none");
        } else {
          passwordError.classList.add("d-none");
        }
      });
    </script>
  </body>
</html>
