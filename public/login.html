<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Learn | Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #6366f1;
        --secondary: #ec4899;
        --bg-dark: #0f172a;
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-dark);
        color: #fff;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        z-index: -1;
      }
      .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -50px; left: -150px; opacity: 0.3; animation: drift 12s infinite alternate ease-in-out; }
      .orb-2 { width: 500px; height: 500px; background: #3b82f6; bottom: -200px; right: -100px; opacity: 0.2; animation: drift 15s infinite alternate-reverse ease-in-out; }
      
      @keyframes drift {
        0% { transform: translate(0, 0); }
        100% { transform: translate(40px, -40px); }
      }

      .login-glass {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 50px 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: fadeScale 0.6s ease-out forwards;
      }
      
      @keyframes fadeScale {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      h2 {
        font-weight: 600;
        text-align: center;
        margin-bottom: 30px;
        font-size: 2rem;
        background: linear-gradient(to right, #fff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .form-floating { margin-bottom: 20px; }
      
      .form-control {
        background: rgba(0,0,0,0.2) !important;
        border: 1px solid rgba(255,255,255,0.1) !important;
        color: #fff !important;
        border-radius: 12px;
      }
      .form-control:focus {
        background: rgba(0,0,0,0.3) !important;
        border-color: var(--primary) !important;
        box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25) !important;
      }
      .form-floating > label { color: #94a3b8; }
      .form-floating > .form-control:focus ~ label,
      .form-floating > .form-control:not(:placeholder-shown) ~ label {
        color: var(--primary) !important;
        background: transparent !important;
      }

      /* Fix bootstrap autofill white background */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active{
          -webkit-box-shadow: 0 0 0 30px var(--bg-dark) inset !important;
          -webkit-text-fill-color: white !important;
          transition: background-color 5000s ease-in-out 0s;
      }

      .btn-login {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        background: linear-gradient(45deg, var(--primary), #8b5cf6);
        border: none;
        color: white;
        font-weight: 600;
        font-size: 1rem;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 8px 15px -5px rgba(99, 102, 241, 0.4);
        margin-top: 10px;
      }
      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 20px -5px rgba(99, 102, 241, 0.6);
        color: white;
      }

      .footer-text {
        text-align: center;
        margin-top: 25px;
        color: #94a3b8;
        font-size: 0.9rem;
      }
      .footer-text a {
        color: #a855f7;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s;
      }
      .footer-text a:hover { color: #d8b4fe; }
    </style>
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-glass">
      <h2>Welcome Back</h2>
      <form action="/login" method="POST">
        <div class="form-floating">
          <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" value="admin@elearn.com" required>
          <label for="email">Email address</label>
        </div>
        <div class="form-floating text-dark">
          <input type="password" class="form-control" id="password" name="password" placeholder="Password" value="admin" required>
          <label for="password">Password</label>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
      </form>
      <div class="footer-text">
        Don't have an account? <a href="/register">Sign up here</a>
      </div>
    </div>
  </body>
</html>
