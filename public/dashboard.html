<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Learn | Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #6366f1;
        --secondary: #ec4899;
        --bg-dark: #0f172a;
        --sidebar-bg: rgba(15, 23, 42, 0.7);
        --glass-bg: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-dark);
        color: #fff;
        min-height: 100vh;
        overflow-x: hidden;
        margin: 0;
        display: flex;
      }
      
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(100px);
        z-index: -1;
      }
      .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -50px; right: -100px; opacity: 0.3; animation: drift 15s infinite alternate ease-in-out; }
      .orb-2 { width: 500px; height: 500px; background: var(--secondary); bottom: -150px; left: -150px; opacity: 0.2; animation: drift 20s infinite alternate-reverse ease-in-out; }
      @keyframes drift {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-40px, 40px); }
      }

      /* Sidebar */
      #sidebar {
        width: 280px;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--glass-border);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        height: 100vh;
        position: fixed;
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        z-index: 1000;
        transition: transform 0.3s ease;
      }
      .brand {
        font-size: 1.8rem;
        font-weight: 800;
        margin-bottom: 40px;
        text-align: center;
        background: linear-gradient(to right, #a855f7, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .nav-link {
        color: #94a3b8;
        padding: 12px 20px;
        border-radius: 12px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 15px;
        font-weight: 600;
        transition: all 0.3s;
      }
      .nav-link:hover, .nav-link.active {
        background: rgba(99, 102, 241, 0.15);
        color: #fff;
      }
      .nav-link i { font-size: 1.2rem; width: 24px; text-align: center; }
      .logout { margin-top: auto; color: #ef4444; }
      .logout:hover { background: rgba(239, 68, 68, 0.15); color: #f87171; }

      /* Main Content */
      #main-content {
        margin-left: 280px;
        padding: 40px;
        width: calc(100% - 280px);
      }
      
      .dashboard-header {
        margin-bottom: 40px;
      }
      .dashboard-header h2 {
        font-weight: 800;
        font-size: 2.5rem;
        background: linear-gradient(to right, #fff, #cbd5e1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      .glass-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(16px);
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        transition: transform 0.3s, box-shadow 0.3s;
        height: 100%;
      }
      .glass-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
      }
      
      .stat-title { color: #94a3b8; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
      .stat-value { font-size: 2rem; font-weight: 800; color: #fff; margin-top: 10px; }
      
      /* Card variants */
      .card-info { border-top: 4px solid #3b82f6; }
      .card-warning { border-top: 4px solid #f59e0b; }
      .card-success { border-top: 4px solid #10b981; }

      /* Chart container */
      .chart-wrapper {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 25px;
        margin-top: 30px;
      }

      /* Chat input container */
      .chat-container {
        position: fixed;
        bottom: 40px;
        right: 40px;
        width: 350px;
        z-index: 100;
      }
      .chat-input {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(10px);
        color: #fff;
        border-radius: 20px;
        padding: 15px 20px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      .chat-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
      }
      
      @media (max-width: 991px) {
        #sidebar { transform: translateX(-100%); width: 250px; }
        #main-content { margin-left: 0; width: 100%; }
        /* Add a mobile toggle if needed */
      }
    </style>
  </head>

  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Sidebar -->
    <nav id="sidebar">
      <div class="brand">E-Learn</div>
      <a href="/dashboard" class="nav-link active"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="/courses" class="nav-link"><i class="fas fa-book-open"></i> Courses</a>
      <a href="/learning" class="nav-link"><i class="fas fa-brain"></i> Learning</a>
      <a href="/workspace" class="nav-link"><i class="fas fa-tools"></i> Workspace</a>
      <a href="/logout" class="nav-link logout"><i class="fas fa-sign-out-alt"></i> Log Out</a>
    </nav>

    <!-- Main Content -->
    <main id="main-content">
      <div class="dashboard-header">
        <h2>Welcome to Your Dashboard, student</h2>
        <p class="text-secondary">Here's an overview of your progress.</p>
      </div>

      <div class="row g-4">
        <!-- User Info Cards -->
        <div class="col-md-4">
          <div class="glass-card card-info">
            <div class="stat-title">Name</div>
            <div class="stat-value" id="user-name">Loading...</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="glass-card card-warning">
            <div class="stat-title">DOB</div>
            <div class="stat-value" id="user-dob">Loading...</div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="glass-card card-success">
            <div class="stat-title">Gender</div>
            <div class="stat-value" id="user-gender">Loading...</div>
          </div>
        </div>
      </div>

      <!-- Chart Section -->
      <div class="chart-wrapper mt-5">
        <canvas id="userChart" height="100"></canvas>
      </div>
    </main>

    <!-- Floating Chat Input -->
    <div class="chat-container">
      <input type="text" class="chat-input" placeholder="Ask AI Assistant..." />
    </div>

    <!-- Bootstrap JS and Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Mock user details since we bypass DB login now
        const mockUser = { name: "Admin User", dob: "1995-10-15", gender: "Not Specified" };
        
        // Let's first try to fetch, if it fails, fallback to mockUser
        const userEmail = "admin@elearn.com";

        fetch(`/user/${userEmail}`)
          .then((response) => {
            if (!response.ok) throw new Error("User not found");
            return response.json();
          })
          .then((data) => {
            document.getElementById("user-name").textContent = data.name;
            document.getElementById("user-dob").textContent = data.dob;
            document.getElementById("user-gender").textContent = data.gender;
          })
          .catch((error) => {
            console.error("Using mock data as db user not found:", error);
            document.getElementById("user-name").textContent = mockUser.name;
            document.getElementById("user-dob").textContent = mockUser.dob;
            document.getElementById("user-gender").textContent = mockUser.gender;
          });

        // Custom styling for Chart.js
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = 'Inter';

        const ctx = document.getElementById("userChart").getContext("2d");
        new Chart(ctx, {
          type: "bar",
          data: {
            labels: ["Courses Completed", "Active Courses", "Projects"],
            datasets: [
              {
                label: "Performance Metrics",
                data: [8, 3, 2],
                backgroundColor: ["#8b5cf6", "#ec4899", "#3b82f6"],
                borderRadius: 8,
                borderSkipped: false,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                position: "top",
                labels: { color: '#fff' }
              },
            },
            scales: {
              y: { grid: { color: 'rgba(255,255,255,0.05)' } },
              x: { grid: { display: false } }
            }
          },
        });
      });
    </script>
  </body>
</html>
